{{ define "main" }}
<div class="max-w-[1080px] mx-auto px-5 md:px-6 py-12">
  <h1 class="text-3xl md:text-4xl font-medium tracking-tight text-foreground">{{ .Title }}</h1>
  {{ with .Content }}<div class="mt-4 text-muted-foreground">{{ . }}</div>{{ end }}
  <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
    {{ range .Pages }}{{ partial "card.html" . }}{{ end }}
  </div>
</div>
{{ end }}
