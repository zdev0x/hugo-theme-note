{{ define "main" }}
<div class="max-w-[1080px] mx-auto px-5 md:px-6 pb-8 md:pb-10 pt-10">
  <header class="relative overflow-hidden text-center mb-10">
    {{ partial "sparkle.html" . }}
    <div class="relative z-10">
      <h1 class="text-3xl md:text-4xl font-medium tracking-tight text-foreground">标签 「{{ .Title }}」</h1>
      <p class="mt-3 font-mono text-sm text-muted-foreground">共 {{ len .Pages }} 篇文章</p>
    </div>
  </header>

  <div class="mt-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
      {{ range $p := .Pages }}{{ partial "card.html" $p }}{{ end }}
    </div>
  </div>
</div>
{{ end }}
