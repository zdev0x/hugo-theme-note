{{/* Share row — mirrors u.sb: Mastodon / X / Bluesky / Telegram / Email / Copy link.
     All links are generic share intents (no personal accounts), safe to publish. */}}
{{ $u := .Permalink }}
{{ $t := .Title }}
{{ $encT := urlquery $t }}
{{ $encU := urlquery $u }}
<div class="mt-6 pt-5 border-t border-border">
  <div class="flex flex-wrap items-center gap-x-5 gap-y-3">
    <span class="font-mono text-sm text-muted-foreground select-none">分享</span>
    <a href="https://share.joinmastodon.org/#text={{ $encT }}%20{{ $encU }}" target="_blank" rel="noopener noreferrer" aria-label="分享到 Mastodon" class="flex items-center justify-center text-muted-foreground hover:text-foreground dark:hover:text-(--link-wave) transition-[color,transform] duration-150 ease-out active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]" aria-hidden="true"><path d="M12.008 2.001c-3.15 0-4.98 1.01-5.98 3.03-.68 1.37-.96 3.1-.96 4.96 0 2.4.06 4.8 1.6 6.3 1.4 1.37 3.4 1.95 5.34 1.95 1.08 0 2.4-.16 3.5-.76-.06-1.1-.34-2.86-.62-3.86-.28-.98-1.3-1.06-2.22-1.02-.94.04-1.78.56-1.86 1.34-.04.4.02.8.02 1.2 0 .84.02 1.66-.18 2.48-.94.02-2.1-.24-3.02-1.12-1.02-.98-1.1-3.06-1.1-4.52 0-1.82.26-3.3.82-4.32.74-1.34 2.12-2.02 4.16-2.02 1.32 0 2.64.2 3.92.6V8.2c-.98-.44-2.3-.66-3.72-.66-2.12 0-2.9.88-2.9 2.56 0 1.72 1.1 2.44 2.86 2.44.3 0 .56-.02.78-.08 0-1.32.34-2.84 1.84-3.1.94-.16 2.16.08 2.64.94.36.64.5 1.62.5 2.72 0 2.62-.5 4.52-1.7 5.64-1.2 1.12-2.9 1.68-5.1 1.68-2.46 0-4.8-.72-6.34-2.18C2.7 16.2 2 13.46 2 10.32c0-1.98.3-3.88 1.08-5.48C4.46 2.7 6.86 1 12.008 1c.34 0 .66.02.98.06V2c-.32 0-.64 0-.98 0Z"/></svg>
    </a>
    <a href="https://x.com/intent/tweet?text={{ $encT }}%20{{ $encU }}" target="_blank" rel="noopener noreferrer" aria-label="分享到 X" class="flex items-center justify-center text-muted-foreground hover:text-foreground dark:hover:text-(--link-wave) transition-[color,transform] duration-150 ease-out active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[16px] h-[16px]" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/></svg>
    </a>
    <a href="https://bsky.app/intent/compose?text={{ $encT }}%20{{ $encU }}" target="_blank" rel="noopener noreferrer" aria-label="分享到 Bluesky" class="flex items-center justify-center text-muted-foreground hover:text-foreground dark:hover:text-(--link-wave) transition-[color,transform] duration-150 ease-out active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]" aria-hidden="true"><path d="M12 10.8c-1.2-2.3-4.5-4.3-7.7-2.9C1.5 9.2.9 12.6 3 14.6c2 1.9 4.2 2.9 6.6 2.7.6 0 1.1-.1 1.6-.2.5.1 1 .2 1.6.2 2.4.2 4.6-.8 6.6-2.7 2.1-2 1.5-5.4-1.3-6.7-3.2-1.4-6.5.6-7.7 2.9Z"/></svg>
    </a>
    <a href="https://t.me/share/url?url={{ $encU }}&amp;text={{ $encT }}" target="_blank" rel="noopener noreferrer" aria-label="分享到 Telegram" class="flex items-center justify-center text-muted-foreground hover:text-foreground dark:hover:text-(--link-wave) transition-[color,transform] duration-150 ease-out active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]" aria-hidden="true"><path d="M21.6 2.4 18.5 20c-.3 1.3-1 1.6-2.1 1l-3.1-2.3-1.5 1.4c-.2.2-.4.4-.8.4l.3-3.7 6.7-6.1c.3-.3-.1-.5-.4-.2L7.3 15.9l-3.6-1.1c-.8-.2-.8-.8.2-1.2L20 2.1c.6-.2 1.1.2.9 1.1l-.3-.8Z"/></svg>
    </a>
    <a href="mailto:?subject={{ $encT }}&amp;body={{ $encU }}" aria-label="通过邮件分享" class="flex items-center justify-center text-muted-foreground hover:text-foreground dark:hover:text-(--link-wave) transition-[color,transform] duration-150 ease-out active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke="currentColor" class="w-[18px] h-[18px]" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2" stroke-linejoin="round"/><path stroke-linecap="round" stroke-linejoin="round" d="m3 6 9 7 9-7"/></svg>
    </a>
    <button id="share-copy" type="button" data-url="{{ $u }}" data-title="{{ $t }}" data-tooltip="复制链接" aria-label="复制链接" class="flex items-center justify-center text-muted-foreground hover:text-foreground dark:hover:text-(--link-wave) transition-[color,transform] duration-150 ease-out active:scale-95 cursor-pointer">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2-10.5A2.5 2.5 0 0 0 14.5 3h-5A2.5 2.5 0 0 0 7 5.5v13A2.5 2.5 0 0 0 9.5 21h5a2.5 2.5 0 0 0 2.5-2.5v-13Z"/></svg>
    </button>
  </div>
</div>
