<div id="search-modal" class="hidden" aria-hidden="true">
  <div id="search-overlay" class="fixed inset-0 z-[10001] bg-black/50 backdrop-blur-[2px]"></div>
  <div class="fixed left-[50%] top-[50%] z-[10002] grid rounded-2xl overflow-hidden w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border border-border bg-card shadow-2xl max-h-[80vh] p-0">
    <div class="flex flex-col relative">
      <div class="flex items-center border-b border-border px-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 text-muted-foreground" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
        <input id="search-input" type="text" placeholder="搜索文章..." class="px-4 py-3 w-full flex-1 bg-transparent text-foreground placeholder:text-muted-foreground focus:outline-none text-[15px]">
        <button id="search-close" class="inline-flex items-center justify-center rounded-full p-2 text-muted-foreground hover:text-foreground hover:bg-secondary transition-colors" aria-label="关闭">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4" aria-hidden="true"><path stroke-linecap="round" d="M6 18 18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="search-results" class="max-h-[50vh] overflow-y-auto">
        <div class="px-4 py-8 text-center text-muted-foreground">输入关键词开始搜索</div>
      </div>
    </div>
  </div>
</div>
<script src="/js/search.js" defer></script>
