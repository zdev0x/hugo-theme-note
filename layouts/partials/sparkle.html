<div class="hero-sparkle-field absolute inset-0 pointer-events-none" aria-hidden="true"></div>
<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var host = document.querySelector('.hero-sparkle-field');
  if (!host) return;

  // Percentage-based placement: no canvas measurement, works at any size.
  for (var i = 0; i < 42; i++) {
    var dot = document.createElement('span');
    dot.className = 'sparkle-dot';
    dot.style.left = (Math.random() * 100).toFixed(2) + '%';
    dot.style.top = (Math.random() * 100).toFixed(2) + '%';
    dot.style.setProperty('--sp-size', (2 + Math.random() * 3).toFixed(1) + 'px');
    dot.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    dot.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
    host.appendChild(dot);
  }

  // Trail is limited to the top hero band, not the whole content area
  // (otherwise it fires over code blocks, which looks wrong).
  document.addEventListener('pointermove', function (e) {
    var r = host.getBoundingClientRect();
    var bottom = r.top + Math.min(220, r.height);
    if (e.clientX < r.left || e.clientX > r.right ||
        e.clientY < r.top || e.clientY > bottom) return;

    var heart = Math.random() < 0.15;
    var t = document.createElement('span');
    t.className = 'sparkle-trail' + (heart ? ' is-heart' : '');
    if (heart) t.textContent = '♥';
    t.style.left = (e.clientX - r.left) + 'px';
    t.style.top = (e.clientY - r.top) + 'px';
    t.style.setProperty('--tr-rot', ((Math.random() - 0.5) * 60).toFixed(0) + 'deg');
    host.appendChild(t);
    window.setTimeout(function () { t.remove(); }, 700);
  }, { passive: true });
})();
</script>
