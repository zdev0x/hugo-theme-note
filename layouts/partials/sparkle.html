<div class="hero-sparkle-field absolute inset-0 pointer-events-none" aria-hidden="true"></div>
<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var host = document.querySelector('.hero-sparkle-field');
  if (!host) return;
  var canvas = document.createElement('canvas');
  host.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var dots = [], w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    var r = host.getBoundingClientRect();
    w = r.width; h = r.height;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.min(70, Math.floor(w * h / 9000));
    dots = Array.from({ length: count }, function () {
      return { x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.6 + 0.4,
               vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15,
               a: Math.random() * 0.5 + 0.1 };
    });
  }
  function tick() {
    ctx.clearRect(0, 0, w, h);
    var color = getComputedStyle(document.documentElement).getPropertyValue('--sparkle').trim() || '#a8a29e';
    dots.forEach(function (d) {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
      ctx.globalAlpha = d.a;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  resize();
  window.addEventListener('resize', resize);
  tick();
})();
</script>
