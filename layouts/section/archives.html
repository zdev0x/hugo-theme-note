{{ define "main" }}
{{ $posts := where site.RegularPages "Section" "posts" }}
<div class="max-w-[1080px] mx-auto px-5 md:px-6 pb-8 md:pb-10 pt-10">
  <header class="relative overflow-hidden">
    {{ partial "sparkle.html" . }}
    <div class="relative z-10 text-center">
      <h1 class="text-3xl md:text-4xl font-medium tracking-tight text-foreground">{{ .Title }}</h1>
      <p class="mt-3 font-mono text-sm text-muted-foreground">共 {{ len $posts }} 篇文章</p>
    </div>
  </header>

  <div class="mt-10 space-y-12">
    {{ range $posts.GroupByDate "2006" }}
    <section>
      <h2 class="text-2xl font-medium tracking-tight text-muted-foreground/70 select-none">{{ .Key }}</h2>
      <div class="mt-4 divide-y divide-border">
        {{ range .Pages }}
        <article class="py-3.5 flex items-baseline gap-4 md:gap-6">
          <time class="font-mono text-sm text-muted-foreground shrink-0 w-[6.5rem]" datetime="{{ .Date.Format "2006-01-02T15:04:05.000Z" }}">{{ .Date.Format "1 月 2 日" }}</time>
          <h3 class="text-[15px] md:text-base font-medium text-foreground">
            <a href="{{ .RelPermalink }}" class="hover:text-(--link-wave) transition-colors">{{ .Title }}</a>
          </h3>
        </article>
        {{ end }}
      </div>
    </section>
    {{ end }}
  </div>
</div>
{{ end }}
