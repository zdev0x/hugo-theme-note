{{ define "main" }}
<div class="max-w-[1080px] mx-auto px-5 md:px-6 pb-8 md:pb-10 pt-10">
  <header class="relative overflow-hidden text-center mb-8">
    {{ partial "sparkle.html" . }}
    <div class="relative z-10">
      <h1 class="text-3xl md:text-4xl font-medium tracking-tight leading-snug text-foreground">友情链接</h1>
    </div>
  </header>

  <div class="bg-card rounded-2xl border border-border shadow-sm px-5 py-8 md:px-12 md:py-12">
    <article class="text-foreground">
      <div id="markdown">
        {{ .Content }}
        <div class="my-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
          {{ range .Params.links }}
          <a class="tile-link block rounded-xl border border-border bg-secondary p-6 transition-[border-color,transform,background-color] duration-200 ease-out hover:border-hairline-strong hover:-translate-y-0.5" href="{{ .url }}" target="_blank" rel="noopener">
            <div class="text-lg font-medium text-foreground">{{ .name }}</div>
            <div class="mt-1 text-sm text-muted-foreground">{{ .desc }}</div>
          </a>
          {{ end }}
        </div>
      </div>
    </article>
  </div>
</div>
{{ end }}
